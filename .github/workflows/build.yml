name: Strato Adreno CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strato-adreno-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 26.1.10909125

jobs:
  android:
    name: Android arm64 build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android build packages and Ninja
        run: |
          sdkmanager "platforms;android-34" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore native CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      - name: Check Adreno branding and packaging
        run: python3 tests/test_adreno_branding.py

      - name: Check Brazilian Portuguese resources
        run: python3 tests/test_ptbr_resources.py

      - name: Run deterministic native regression tests
        run: |
          python3 tests/test_frame_pacing.py
          python3 tests/test_scheduler_timing.py

      - name: Run Android unit tests and build release APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_COMPILERCHECK: content
        run: >-
          ./gradlew --no-daemon --stacktrace --build-cache --parallel
          --configure-on-demand testMainlineReleaseUnitTest assembleMainlineRelease

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Strato-Adreno-APK
          path: app/build/outputs/apk/mainline/release/*.apk
          if-no-files-found: error
          retention-days: 14
