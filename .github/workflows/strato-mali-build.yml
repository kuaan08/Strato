name: Build Strato Mali

on:
  workflow_dispatch:

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Strato Mali
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch submodules with retry
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git -c protocol.version=2 submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            echo "Submodule fetch attempt $attempt failed; retrying..."
            sleep 10
          done
          exit 1

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Bundle PanVK G615
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/gpu_drivers
          gh release download panvk-g615-strato-dev1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "PanVK-G615-Strato-Mali-0.1.0-strato-dev.1.zip" \
            --dir app/src/main/assets/gpu_drivers

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/
          key: ${{ runner.os }}-strato-mali-gradle-${{ hashFiles('**/build.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-strato-mali-gradle-

      - name: Build Strato Mali
        run: ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Strato-Mali-APK
          path: app/build/outputs/apk/mainline/release/*.apk
          if-no-files-found: error
