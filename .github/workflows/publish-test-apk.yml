name: Publish Strato Adreno Test APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Strato Adreno CI run ID"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful Strato Adreno APK
        uses: actions/download-artifact@v4
        with:
          name: Strato-Adreno-APK
          path: apk
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publish rolling Adreno test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh apk
          APK="$(find apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          gh release delete strato-adreno-latest --repo "${GITHUB_REPOSITORY}" --cleanup-tag -y || true
          gh release create strato-adreno-latest "$APK#Strato-Adreno-latest.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Strato Adreno latest test" \
            --notes "Rolling Strato Adreno test build. APK is signed with the Gradle debug key; it is not a Play Store release." \
            --prerelease
